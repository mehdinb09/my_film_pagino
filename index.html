<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY SERVICE VIP 💎</title>

<style>
body{
    margin:0;
    font-family:tahoma;
    background:#101827;
    color:white;
    text-align:center;
}

.box{
    width:90%;
    max-width:450px;
    margin:40px auto;
    background:#283346;
    padding:30px;
    border-radius:30px;
}

h1{
    color:#00d9ff;
    font-size:40px;
}

.card{
    background:#3b4659;
    margin:15px 0;
    padding:20px;
    border-radius:20px;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
    background:#00c853;
    color:white;
}

.off{
    background:#777;
    cursor:not-allowed;
}

.logout{
    background:#f44336;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="box" id="login">

<h1>💎 MY SERVICE VIP</h1>

<p>ورود موفق بود ✅</p>

<div class="card">
<h2>خدمات ویژه 🚀</h2>
<p>دسترسی شما به پنل VIP فعال شد</p>
</div>

<button onclick="showPanel()">ورود به خدمات</button>

</div>


<div class="box" id="panel" style="display:none">

<h1>💎 VIP PANEL</h1>


<div class="card">
<h2>📱 بررسی و پیگیری حساب روبیکا</h2>
<button>سفارش</button>
</div>


<div class="card">
<h2>🔒 رفع مشکل تعلیق حساب</h2>
<button>به زودی</button>
</div>


<div class="card">
<h2>⭐ خدمات دیگر</h2>
<button class="off">به زودی</button>
</div>


<button class="logout" onclick="location.reload()">
خروج 🚪
</button>

</div>


<script>
function showPanel(){
document.getElementById("login").style.display="none";
document.getElementById("panel").style.display="block";
}
</script>

</body>
</html>
