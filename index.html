<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY FILM</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#08090d;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-box{
  width:90%;
  max-width:420px;
  background:#11131a;
  border:1px solid #252936;
  border-radius:25px;
  padding:30px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  text-align:center;
}

.logo{
  font-size:32px;
  font-weight:bold;
  margin-bottom:10px;
}

.logo span{
  color:#e50914;
}

.subtitle{
  color:#aaa;
  font-size:14px;
  margin-bottom:30px;
}

h2{
  margin-bottom:10px;
}

.input{
  width:100%;
  padding:16px;
  margin-top:18px;
  border-radius:14px;
  border:1px solid #30333d;
  background:#08090d;
  color:white;
  font-size:16px;
  outline:none;
  direction:ltr;
  text-align:left;
}

.input:focus{
  border-color:#e50914;
}

.btn{
  width:100%;
  padding:16px;
  margin-top:15px;
  border:0;
  border-radius:14px;
  background:#e50914;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.btn:hover{
  background:#c70710;
}

.otp-box{
  display:none;
}

.back{
  margin-top:15px;
  color:#aaa;
  cursor:pointer;
  font-size:14px;
}

.message{
  margin-top:15px;
  color:#aaa;
  font-size:13px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    MY <span>FILM</span>
  </div>

  <div class="subtitle">
    برای ورود به سایت شماره موبایل خود را وارد کنید
  </div>

  <!-- شماره موبایل -->
  <div id="phoneBox">

    <h2>ورود / ثبت‌نام</h2>

    <input
      id="phone"
      class="input"
      type="tel"
      placeholder="09123456789"
      maxlength="11"
    >

    <button class="btn" onclick="sendCode()">
      ارسال کد تأیید
    </button>

    <div class="message" id="phoneMessage"></div>

  </div>


  <!-- کد تأیید -->
  <div class="otp-box" id="otpBox">

    <h2>کد تأیید</h2>

    <div class="subtitle">
      کد ارسال‌شده را وارد کنید
    </div>

    <input
      id="otp"
      class="input"
      type="tel"
      placeholder="123456"
      maxlength="6"
    >

    <button class="btn" onclick="verifyCode()">
      تأیید و ورود
    </button>

    <div class="message" id="otpMessage"></div>

    <div class="back" onclick="backToPhone()">
      تغییر شماره موبایل
    </div>

  </div>

</div>


<script>

function sendCode(){

  const phone = document.getElementById("phone").value.trim();

  if(!/^09\d{9}$/.test(phone)){
    document.getElementById("phoneMessage").innerText =
      "لطفاً شماره موبایل ایرانی را درست وارد کنید.";
    return;
  }

  document.getElementById("phoneMessage").innerText =
    "در حال ارسال کد...";

  /*
    فعلاً SMS واقعی وصل نیست.
    بعداً API سرویس پیامک را اینجا وصل می‌کنیم.
  */

  setTimeout(function(){

    document.getElementById("phoneBox").style.display="none";
    document.getElementById("otpBox").style.display="block";

  },700);
}


function verifyCode(){

  const code = document.getElementById("otp").value.trim();

  if(!/^\d{6}$/.test(code)){
    document.getElementById("otpMessage").innerText =
      "کد باید ۶ رقمی باشد.";
    return;
  }

  document.getElementById("otpMessage").innerText =
    "کد وارد شد. مرحله اتصال به سرور بعداً انجام می‌شود.";

}


function backToPhone(){

  document.getElementById("otpBox").style.display="none";
  document.getElementById("phoneBox").style.display="block";

}

</script>

</body>
      </html>
