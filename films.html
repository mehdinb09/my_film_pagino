<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>فیلم‌ها | MY FILM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Tahoma, Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      background: linear-gradient(135deg, #151515, #252525);
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      color: #aaa;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px;
    }

    .film-box {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .film-title {
      font-size: 24px;
      margin: 0 0 15px;
    }

    video {
      width: 100%;
      display: block;
      border-radius: 14px;
      background: #000;
    }

    .download {
      display: block;
      margin-top: 18px;
      padding: 14px;
      text-align: center;
      text-decoration: none;
      color: white;
      background: #e50914;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
    }

    .download:hover {
      background: #b20710;
    }

    .back {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: #aaa;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 MY FILM</h1>
    <p>تماشای فیلم</p>
  </header>

  <main class="container">

    <div class="film-box">

      <h2 class="film-title">🎥 فیلم اول</h2>

      <video controls playsinline preload="metadata">
        <source src="./-2147483648_-210654.mp4" type="video/mp4">
        مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
      </video>

      <a
        class="download"
        href="./-2147483648_-210654.mp4"
        download
      >
        ⬇️ دانلود فیلم
      </a>

      <a class="back" href="./index.html">
        ← بازگشت به صفحه اصلی
      </a>

    </div>

  </main>

</body>
</html>
